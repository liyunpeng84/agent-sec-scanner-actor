model = "gpt-5"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[mcp_servers.deepseek-helper]
command = "uvx"
args = ["deepseek-mcp-server"]
env = { DEEPSEEK_API_KEY = "sk-EXAMPLE0fake0deepseek0key0000000" }

[mcp_servers.zhipu]
command = "npx"
args = ["-y", "zhipu-mcp@1.0.4"]
env = { ZHIPUAI_API_KEY = "0123456789abcdef0123456789abcdef.EXAMPLEfakeKEY00" }
